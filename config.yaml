# ============================================================
# Enterprise RAG System - Configuration
# ============================================================

# --- Model Selection ---
models:
  # Embedding model for vectorization
  embedding:
    provider: "dashscope"          # openai | huggingface | local | dashscope
    model_name: "text-embedding-v4"
    dimension: 1024
    batch_size: 32

  # LLM for answer generation
  llm:
    provider: "deepseek"          # openai | ollama | vllm | anthropic | dashscope | deepseek
    model_name: "deepseek-v4-pro"
    temperature: 0.1
    max_tokens: 2048

  # Reranker model
  reranker:
    provider: "huggingface"     # huggingface | cohere | jina
    model_name: "D:/AiApplication/projects/Rag/models/bge-reranker-v2-m3"
    top_k: 10
    score_threshold: 0.5       # rerank 最低相关度阈值，低于此值的文档不返回(0 表示不过滤)

# --- Vector Store (Qdrant) ---
qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  prefer_grpc: false
  api_key: null                # set via env: QDRANT_API_KEY
  collection_name: "rag_documents"
  vector_size: 1024
  distance: "Cosine"           # Cosine | Euclidean | Dot

# --- Document Processing ---
document:
  # 默认分块参数（未在 per_type 中配置的格式使用）
  default_chunk_size: 512
  default_chunk_overlap: 50
  # Excel 文件超过该大小后直接逐 Sheet 解析，不再上传 MinerU
  excel_mineru_max_mb: 20
  # 按文件类型独立配置分块参数
  per_type:
    md:    { chunk_size: 512, chunk_overlap: 64 }
    txt:   { chunk_size: 512, chunk_overlap: 50 }
    pdf:   { chunk_size: 800, chunk_overlap: 80 }
    docx:  { chunk_size: 600, chunk_overlap: 60 }
    pptx:  { chunk_size: 400, chunk_overlap: 40 }
    xlsx:  { chunk_size: 300, chunk_overlap: 30 }
    xls:   { chunk_size: 300, chunk_overlap: 30 }
    png:   { chunk_size: 500, chunk_overlap: 50 }
    jpg:   { chunk_size: 500, chunk_overlap: 50 }
    jpeg:  { chunk_size: 500, chunk_overlap: 50 }
    bmp:   { chunk_size: 500, chunk_overlap: 50 }
    tiff:  { chunk_size: 500, chunk_overlap: 50 }
  supported_formats:
    - "pdf"
    - "docx"
    - "txt"
    - "md"
    - "csv"

# --- Retrieval ---
retrieval:
  top_k: 20
  retrieval_type: "hybrid"     # dense | sparse | hybrid
  fusion_method: "rrf"         # rrf | weighted_score
  dense_weight: 0.7
  sparse_weight: 0.3

# --- Cache ---
cache:
  enabled: true
  backend: "redis"             # redis | memory | disk
  redis_host: "localhost"
  redis_port: 6379
  ttl_seconds: 86400
  semantic_enabled: true       # 是否启用语义缓存（需要 Redis Stack）
  similarity_threshold: 0.92   # 语义命中最低余弦相似度（0~1）
  vec_dim: 1024                # embedding 向量维度（须与模型匹配）

# --- Logging ---
logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/rag.log"
  console: true

# --- API Server ---
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true                 # auto-reload in dev

# --- Streamlit ---
streamlit:
  port: 8501
  theme: "light"

# --- PostgreSQL 会话持久化 ---
postgresql:
  host: "localhost"
  port: 5432
  user: rag_user
  password: rag_password
  database: "rag_sessions"

# --- Session Context（会话上下文管理） ---
session_context:
  max_history_messages: 20   # 上下文窗口保留的消息数
  max_context_tokens: 3000   # 拼入 Prompt 的历史 token 上限
  summary_enabled: true      # token 超限时是否用 LLM 摘要压缩历史
